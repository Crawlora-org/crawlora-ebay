[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-ebay"
version = "0.1.1"
description = "Crawlora eBay API client with 10 endpoints for listing search, item details, seller profiles, feedback and shops, and eBay Live streams"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "ebay", "ebay-api", "ebay-scraper", "ebay-data", "ebay-listing-search", "ebay-item-details", "ebay-seller-profiles", "ebay-feedback-shops", "ebay-live-streams"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=ebay-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=ebay-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-ebay"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_ebay"]

[tool.setuptools.package-data]
"crawlora_ebay" = ["py.typed", "*.pyi"]
